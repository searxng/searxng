name: Feature request
description: Request a new feature in SearXNG
labels: ["new feature"]
type: feature
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A concise description of the feature.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when [...]

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: I want to be able to [...]
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: I've considered [...]

  - type: checkboxes
    id: ai-policy
    attributes:
      label: Code of Conduct
      options:
        - label: >
            I read the [AI Policy](https://github.com/searxng/searxng/blob/master/AI_POLICY.rst)
            and hereby confirm that this issue conforms with the policy.
          required: true
